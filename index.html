<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
    <title>web-core 8.4</title>
</head>
<body>
<section class="mobile">
    <img class="blue-line" src="icons/line.svg" alt="">
    <h1 class="repair-h1">РЕМОНТ ТЕХНИКИ РАЗЛИЧНЫХ БРЕНДОВ</h1>
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide"> <img src="icons/cat1.svg" alt=""></div>
            <div class="swiper-slide"><img src="icons/cat1 copy.svg" alt=""></div>
            <div class="swiper-slide"><img src="icons/cat1 copy 2.svg" alt=""></div>
            <div class="swiper-slide"><img src="icons/cat1 copy 3.svg" alt=""></div>
            <div class="swiper-slide"><img src="icons/cat1 copy 7.svg" alt=""></div>
            <div class="swiper-slide"><img src="icons/cat1 copy 8.svg" alt=""></div>
            <div class="swiper-slide"><img src="icons/cat1 copy 9.svg" alt=""></div>
            <div class="swiper-slide"><img src="icons/cat1 copy 10.svg" alt=""></div>
            <div class="swiper-slide"><img src="icons/cat1 copy 11.svg" alt=""></div>
        </div>
    <div class="swiper-pagination"></div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</section>

<section class="tablet">
    <img class="blue-line" src="icons/line.svg" alt="">
    <h1 class="tablet-h1">РЕМОНТ ТЕХНИКИ РАЗЛИЧНЫХ БРЕНДОВ</h1>
    <div class="tablet-open">
        <img class="button" src="icons/cat1.svg" alt="">
        <img class="button" src="icons/cat1 copy.svg" alt="">
        <img class="button" src="icons/cat1 copy 2.svg" alt="">
        <img class="button" src="icons/cat1 copy 3.svg" alt="">
        <img class="button" src="icons/cat1 copy 7.svg" alt="">
        <img class="button" src="icons/cat1 copy 8.svg">
    </div>
    <div class="tablet-close"
        <img class="button" src="icons/cat1 copy 9.svg" alt="">
        <img class="button" src="icons/cat1 copy 10.svg" alt="">
        <img class="button" src="icons/cat1 (1).svg" alt="">
        <img class="button" src="icons/cat1 copy.svg" alt="">
        <img class="button" src="icons/cat1 copy 11.svg" alt="">
    </div> 
</section>

</body>
</html>
